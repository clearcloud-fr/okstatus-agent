# OKS-602 — cut a release by tagging: `git tag v1.2.3 && git push origin v1.2.3`.
#
# Each architecture builds on its own native runner (no QEMU), inside the
# `rust:1.97-bookworm` container rather than on the runner's host: the runner
# image ships glibc 2.39 while the runtime base (debian:bookworm-slim) is on
# 2.36, and a binary linked against the newer one dies with
# "GLIBC_2.39 not found" — that is exactly what shipped in 0.23.2.
#
# Outputs: linux/amd64 + linux/arm64 binaries and SHA256SUMS on the GitHub
# release, plus the multi-arch ghcr.io/clearcloud-fr/okstatus-agent image.
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to (re)build, e.g. v1.0.0"
        required: true

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/clearcloud-fr/okstatus-agent
  RUST_IMAGE: rust:1.97-bookworm

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Version from tag
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          echo "APP_VERSION=${tag#v}" >> "$GITHUB_ENV"

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            .cargo-home/registry
            .cargo-home/git
            target
          key: ${{ matrix.arch }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ matrix.arch }}-cargo-

      # Stamp the tag into Cargo.toml so CARGO_PKG_VERSION (banner, tracing
      # line, enrolment heartbeat) matches the release — same trick as the
      # source Dockerfile.
      - name: Build
        run: |
          sed -i "0,/^version = \".*\"/s//version = \"$APP_VERSION\"/" Cargo.toml
          # …and in the lock file too, otherwise --locked rejects the build
          # ("cannot update the lock file") because the package it records is
          # still on the Cargo.toml version we just rewrote.
          sed -i '/^name = "okstatus-agent"$/{n;s/^version = ".*"/version = "'"$APP_VERSION"'"/}' Cargo.lock
          docker run --rm \
            -v "$PWD":/w -w /w \
            -e CARGO_HOME=/w/.cargo-home \
            -e CARGO_TERM_COLOR=always \
            "$RUST_IMAGE" \
            cargo build --release --locked
          mkdir -p dist
          cp target/release/okstatus-agent "dist/okstatus-agent-linux-${{ matrix.arch }}"
          chmod +x "dist/okstatus-agent-linux-${{ matrix.arch }}"
          # The cache action cannot read root-owned files left by the container.
          sudo chown -R "$(id -u):$(id -g)" .cargo-home target dist

      # Guards the glibc regression above: the binary must load on
      # debian:bookworm-slim (glibc 2.36), not just on the runner host.
      - name: Check runtime linkage
        run: |
          docker run --rm --platform "linux/${{ matrix.arch }}" -v "$PWD/dist":/d debian:bookworm-slim \
            sh -c 'apt-get update -qq && apt-get install -y -qq libssl3 ca-certificates >/dev/null && ldd /d/okstatus-agent-linux-${{ matrix.arch }}'

      - uses: actions/upload-artifact@v4
        with:
          name: okstatus-agent-linux-${{ matrix.arch }}
          path: dist/okstatus-agent-linux-${{ matrix.arch }}
          if-no-files-found: error

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      # Push one single-arch image per runner, addressed by digest only; the
      # `image` job below stitches them into one multi-arch tag.
      - name: Build and push image by digest
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.release
          platforms: linux/${{ matrix.arch }}
          build-args: APP_VERSION=${{ env.APP_VERSION }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${digest#sha256:}"
        env:
          digest: ${{ steps.push.outputs.digest }}

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  image:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Create multi-arch manifest
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          version="${tag#v}"
          docker buildx imagetools create \
            -t "$IMAGE:$version" -t "$IMAGE:latest" \
            $(printf "${IMAGE}@sha256:%s " $(ls /tmp/digests))
          docker buildx imagetools inspect "$IMAGE:$version"

  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/download-artifact@v5
        with:
          path: dist
          pattern: okstatus-agent-linux-*
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          chmod +x okstatus-agent-linux-*
          sha256sum okstatus-agent-linux-* > SHA256SUMS
          cat SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          gh release view "$tag" >/dev/null 2>&1 \
            && gh release upload "$tag" dist/* --clobber \
            || gh release create "$tag" dist/* \
                 --title "$tag" \
                 --notes "Binaries for linux/amd64 and linux/arm64, verify with \`sha256sum -c SHA256SUMS\`.

          Container image: \`docker pull ${IMAGE}:${tag#v}\`

          See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)."
